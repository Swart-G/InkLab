name: Publish InkLab Preview

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - README.md
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/publish-preview.yml
      - .github/release-notes.md

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InkLab-preview-arm64.apk

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: inklab-preview
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" InkLab-preview-arm64.apk --clobber
          gh release edit "$RELEASE_TAG" \
            --title "InkLab Preview" \
            --notes-file .github/release-notes.md \
            --prerelease

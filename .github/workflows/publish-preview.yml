name: Publish InkLab Preview

on:
  push:
    branches:
      - main
    paths:
      - app/**
      - README.md
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/publish-preview.yml
      - .github/release-notes.md
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - README.md
      - THIRD_PARTY_NOTICES.md
      - .github/workflows/publish-preview.yml

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build signed release
        run: ./gradlew clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify release signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare APK
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/release/app-release.apk InkLab-preview-arm64.apk
          sha256sum InkLab-preview-arm64.apk > InkLab-preview-arm64.apk.sha256

      - name: Publish preview release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: inklab-preview
        run: |
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" InkLab-preview-arm64.apk InkLab-preview-arm64.apk.sha256 --clobber
          gh release edit "$RELEASE_TAG" \
            --title "InkLab Preview" \
            --notes-file .github/release-notes.md \
            --prerelease
